<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>養豬場 MIX - 私人備份圖鑑系統</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background-color: #f4f6f8; 
      margin: 0; 
      padding: 20px; 
    }
    .container { 
      max-width: 1000px; 
      margin: 0 auto; 
      background: #fff; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    h1 { margin-top: 0; color: #333; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input[type="text"] { flex-grow: 1; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; vertical-align: middle; }
    th { background-color: #f8fafc; font-weight: 600; }
    tr:nth-child(even) { background-color: #f8fafc; }
    .pig-img { width: 50px; height: 50px; object-fit: contain; }
    .star { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐖 養豬場 MIX - 豬隻備份資料庫</h1>
    
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜尋豬隻編號或名稱..." oninput="filterData()">
      <select id="rareFilter" onchange="filterData()">
        <option value="">全部稀有度</option>
        <option value="1">⭐ (1星)</option>
        <option value="2">⭐⭐ (2星)</option>
        <option value="3">⭐⭐⭐ (3星)</option>
        <option value="4">⭐⭐⭐⭐ (4星)</option>
        <option value="5">⭐⭐⭐⭐⭐ (5星)</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>圖片</th>
          <th>編號</th>
          <th>豬隻名稱</th>
          <th>稀有度</th>
          <th>進貨價</th>
          <th>養成時間</th>
          <th>成豬目標體重</th>
        </tr>
      </thead>
      <tbody id="pigTableBody">
        <tr><td colspan="7" style="text-align:center;">資料載入中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let rawData = [];

    // 載入本地 JSON 資料
    fetch('./data/pigs.json')
      .then(response => {
        if (!response.ok) throw new Error('HTTP 錯誤！狀態碼：' + response.status);
        return response.json();
      })
      .then(data => {
        rawData = data;
        renderTable(rawData);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('pigTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">無法載入豬隻資料檔案 (data/pigs.json)</td></tr>';
      });

    // 渲染表格內容
    function renderTable(data) {
      const tbody = document.getElementById('pigTableBody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">無符合條件的資料</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(item => `
        <tr>
          <td><img src="${item.png}" class="pig-img" alt="${item.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/50?text=No+Image';"></td>
          <td><strong>#${item.pNo}</strong></td>
          <td>${item.name}</td>
          <td><span class="star">${'⭐'.repeat(item.rare)}</span></td>
          <td>$${item.price.toLocaleString()}</td>
          <td>${item.lifespan} 小時</td>
          <td>${item.bigWeight} kg</td>
        </tr>
      `).join('');
    }

    // 搜尋與篩選機制
    function filterData() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const rare = document.getElementById('rareFilter').value;

      const filtered = rawData.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query) || 
                              String(item.pNo).includes(query);
        const matchesRare = !rare || item.rare === Number(rare);
        return matchesSearch && matchesRare;
      });

      renderTable(filtered);
    }
  </script>
</body>
</html>
