<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>養豬場 Mix 豬隻圖鑑資料庫</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <header>
        <h1>養豬場 Mix 圖鑑資料庫</h1>
    </header>

    <main class="container">
        <section class="controls">
            <input type="text" id="searchInput" placeholder="搜尋豬隻名稱、顏色或圖鑑頁數...">
            
            <select id="foodFilter">
                <option value="">所有食物種類</option>
                <option value="不挑食">不挑食</option>
                <option value="挑食">挑食/特殊需求</option>
            </select>

            <select id="sortSelect">
                <option value="id-asc">編號小到大</option>
                <option value="id-desc">編號大到小</option>
                <option value="price-desc">售價高到低</option>
            </select>
        </section>

        <div id="status">資料載入中...</div>

        <section id="pigGrid" class="pig-grid"></section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
